{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "jiramcp.fullname" . }}
  labels:
    {{- include "jiramcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "jiramcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.networkPolicy.allowedClientNamespaces }}
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedClientNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: mcp
          protocol: TCP
        - port: health
          protocol: TCP
  {{- else }}
  # No allowedClientNamespaces configured: deny all ingress. An empty `from:`
  # would instead match every source (allow-all), so emit an empty rule list to
  # lock the pod down explicitly.
  ingress: []
  {{- end }}
  egress:
    # DNS resolution.
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS egress to Jira, restricted to allowedEgressCIDRs (an empty `to:`
    # would allow all destinations; FQDN restriction requires a capable CNI).
    {{- if .Values.networkPolicy.allowedEgressCIDRs }}
    - to:
        {{- range .Values.networkPolicy.allowedEgressCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
    {{- else }}
    - to: []
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- end }}
