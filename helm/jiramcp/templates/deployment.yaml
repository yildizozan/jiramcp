{{- include "jiramcp.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jiramcp.fullname" . }}
  labels:
    {{- include "jiramcp.labels" . | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    # Roll the Deployment when its Secret/ConfigMap change out-of-band (e.g. an
    # external Secret rotated by External Secrets Operator) — Helm cannot hash a
    # Secret it does not render. Requires the stakater/reloader controller; a
    # harmless unknown annotation if it is not installed.
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "jiramcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when chart-rendered config/secret content changes on
        # `helm upgrade`. Out-of-band rotation of an external Secret is handled
        # by Reloader instead (see .Values.reloader); Helm cannot hash a Secret
        # it does not render.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.jira.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "jiramcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jiramcp.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: jiramcp
          image: {{ include "jiramcp.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ .Values.mcp.transport | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: mcp
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.service.healthPort }}
              protocol: TCP
          env:
            - name: JIRA_BASE_URL
              value: {{ .Values.jira.baseUrl | quote }}
            - name: JIRA_AUTH_MODE
              value: {{ .Values.jira.authMode | quote }}
            - name: JIRA_DEFAULT_ISSUE_TYPE
              value: {{ .Values.jira.defaultIssueType | quote }}
            - name: JIRA_HTTP_TIMEOUT
              value: {{ .Values.jira.httpTimeout | quote }}
            {{- if include "jiramcp.hasMapping" . }}
            - name: JIRA_TEAM_MAPPING_FILE
              value: /etc/jiramcp/team-mapping.yaml
            {{- end }}
            {{- with .Values.jira.projects }}
            - name: JIRA_PROJECTS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.jira.defaultProject }}
            - name: JIRA_DEFAULT_PROJECT
              value: {{ . | quote }}
            {{- end }}
            - name: MCP_AUTH_MODE
              value: {{ .Values.mcp.authMode | quote }}
            - name: MCP_HTTP_ADDR
              value: ":{{ .Values.service.containerPort }}"
            - name: MCP_HTTP_PATH
              value: {{ .Values.mcp.httpPath | quote }}
            - name: MCP_ALLOW_UNAUTHENTICATED
              value: {{ .Values.mcp.allowUnauthenticated | quote }}
            - name: HTTP_HEALTH_ADDR
              value: ":{{ .Values.service.healthPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            {{- if include "jiramcp.usesServiceAccount" . }}
            {{- if eq .Values.jira.authMode "cloud" }}
            - name: JIRA_AUTH_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "jiramcp.secretName" . }}
                  key: {{ .Values.jira.secretKeys.authEmail }}
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "jiramcp.secretName" . }}
                  key: {{ .Values.jira.secretKeys.apiToken }}
            {{- else }}
            - name: JIRA_PAT
              valueFrom:
                secretKeyRef:
                  name: {{ include "jiramcp.secretName" . }}
                  key: {{ .Values.jira.secretKeys.pat }}
            {{- end }}
            {{- end }}
            {{- if and (eq .Values.mcp.transport "http") (eq .Values.mcp.authMode "token") (not .Values.mcp.allowUnauthenticated) }}
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "jiramcp.secretName" . }}
                  key: {{ .Values.mcp.authTokenKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if include "jiramcp.hasMapping" . }}
            - name: team-mapping
              mountPath: /etc/jiramcp
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if include "jiramcp.hasMapping" . }}
        - name: team-mapping
          configMap:
            name: {{ include "jiramcp.fullname" . }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
