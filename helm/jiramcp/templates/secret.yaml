{{- if and (not .Values.jira.existingSecret) (or (include "jiramcp.usesServiceAccount" .) (and (eq .Values.mcp.transport "http") (eq .Values.mcp.authMode "token") (not .Values.mcp.allowUnauthenticated))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jiramcp.fullname" . }}
  labels:
    {{- include "jiramcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if include "jiramcp.usesServiceAccount" . }}
  {{- if eq .Values.jira.authMode "cloud" }}
  {{ .Values.jira.secretKeys.authEmail }}: {{ required "jira.secret.authEmail is required for cloud auth (or set jira.existingSecret)" .Values.jira.secret.authEmail | quote }}
  {{ .Values.jira.secretKeys.apiToken }}: {{ required "jira.secret.apiToken is required for cloud auth (or set jira.existingSecret)" .Values.jira.secret.apiToken | quote }}
  {{- else }}
  {{ .Values.jira.secretKeys.pat }}: {{ required "jira.secret.pat is required for dc auth (or set jira.existingSecret)" .Values.jira.secret.pat | quote }}
  {{- end }}
  {{- end }}
  {{- if and (eq .Values.mcp.transport "http") (eq .Values.mcp.authMode "token") (not .Values.mcp.allowUnauthenticated) }}
  {{ .Values.mcp.authTokenKey }}: {{ required "mcp.authToken is required for http transport (or set jira.existingSecret with the token)" .Values.mcp.authToken | quote }}
  {{- end }}
{{- end }}
