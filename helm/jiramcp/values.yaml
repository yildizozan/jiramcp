# Default values for jiramcp.

replicaCount: 2

image:
  registry: docker.io           # override for a private/mirror registry; set "" to omit
  repository: yildizozan/jiramcp
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Jira connection
# ---------------------------------------------------------------------------
jira:
  baseUrl: ""                 # e.g. https://jira.yildizozan.com  (REQUIRED)
  authMode: cloud             # cloud (email+token) | dc (PAT)
  defaultIssueType: Task
  httpTimeout: 15s

  # Provide credentials either via an existing Secret (recommended, works with
  # External Secrets Operator) or have the chart create one from the values
  # below. Never commit real secrets to values.yaml.
  existingSecret: ""
  # Keys to read from the (existing or generated) Secret.
  secretKeys:
    authEmail: JIRA_AUTH_EMAIL
    apiToken: JIRA_API_TOKEN
    pat: JIRA_PAT
  # Used only when existingSecret is empty (chart creates the Secret).
  secret:
    authEmail: ""
    apiToken: ""
    pat: ""

# Team -> project routing (YAML). Rendered into a ConfigMap and mounted as a
# file; the app reads it via JIRA_TEAM_MAPPING_FILE.
teamMapping:
  inlineYaml: |
    teams:
      platform:
        projectKey: PLAT
        defaultIssueType: Task
    defaultTeam: platform

# ---------------------------------------------------------------------------
# MCP server
# ---------------------------------------------------------------------------
mcp:
  transport: http             # http | stdio
  httpPath: /mcp
  # Bearer token required to call the HTTP endpoint. Strongly recommended.
  # Sourced from the Secret (key MCP_AUTH_TOKEN) like other credentials.
  authToken: ""               # used only when existingSecret is empty
  authTokenKey: MCP_AUTH_TOKEN
  # Disable HTTP auth entirely. DANGEROUS — local/dev only.
  allowUnauthenticated: false

logging:
  level: info                 # debug|info|warn|error
  format: json                # json|text

service:
  type: ClusterIP
  # Exposed MCP service port. 80 lets clients use a portless in-cluster URL
  # (http://<name>.<ns>.svc/mcp); the Service routes it to the pod's containerPort.
  port: 80
  healthPort: 8081
  # Port the app binds inside the container. Kept >=1024 because the container
  # runs as nonroot with all capabilities dropped and cannot bind :80.
  containerPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: jiramcp.yildizozan.com
      paths:
        - path: /mcp
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

autoscaling:
  # Safe to enable: the HTTP transport runs stateless, so replicas need no
  # sticky sessions.
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  # Namespaces allowed to reach the MCP/health ports. Empty => deny all ingress
  # (the pod is locked down); list client namespaces to allow them in.
  allowedClientNamespaces: []
  # CIDRs the pod may reach on :443 (Jira). Default allows all; narrow this to
  # the Jira server's address range to limit egress/SSRF blast radius. Empty
  # also allows all (FQDN-based restriction requires a CNI that supports it).
  allowedEgressCIDRs:
    - 0.0.0.0/0

# Credential/config rotation. Pods read JIRA_PAT / MCP_AUTH_TOKEN from the Secret
# at startup; when the Secret is external (jira.existingSecret) Helm cannot hash
# its contents to roll pods on rotation. Enable this to annotate the Deployment
# for stakater/reloader, which restarts it when the referenced Secret/ConfigMap
# change. No-op (harmless annotation) if the Reloader controller is not installed;
# without it, rotate by running `kubectl rollout restart deployment/<name>`.
reloader:
  enabled: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod/container hardening (overridable).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
podAnnotations: {}
podLabels: {}
extraEnv: []
